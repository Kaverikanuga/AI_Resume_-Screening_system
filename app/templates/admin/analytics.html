{% extends 'base.html' %}
{% block title %}Analytics{% endblock %}
{% block content %}
<div class="page-header">
    <div class="container">
        <h1 class="gradient-text"><i class="fas fa-chart-pie me-2"></i>Analytics</h1>
        <p>System-wide analytics and insights</p>
    </div>
</div>

<div class="container section-pad-top">
    <div class="row g-4">
        <div class="col-lg-8" data-aos="fade-up">
            <div class="glass-card p-4">
                <h5 class="card-title"><i class="fas fa-chart-line me-2"></i>Score Distribution</h5>
                <canvas id="scoreChart" height="120"></canvas>
            </div>
        </div>
        <div class="col-lg-4" data-aos="fade-up" data-aos-delay="100">
            <div class="glass-card p-4">
                <h5 class="card-title"><i class="fas fa-chart-pie me-2"></i>Health Status</h5>
                <canvas id="healthChart" height="200"></canvas>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Score distribution chart
        const scoreCtx = document.getElementById('scoreChart');
        if (scoreCtx) {
            new Chart(scoreCtx, {
                type: 'bar',
                data: {
                    labels: ['Keyword', 'Formatting', 'Readability', 'Grammar', 'Professional', 'Overall'],
                    datasets: [{
                        label: 'Average Score',
                        data: [
                            {{ avg_keyword|default(0) }},
                            {{ avg_formatting|default(0) }},
                            {{ avg_readability|default(0) }},
                            {{ avg_grammar|default(0) }},
                            {{ avg_professional|default(0) }},
                            {{ avg_overall|default(0) }}
                        ],
                        backgroundColor: 'rgba(108, 92, 231, 0.7)',
                        borderColor: '#6c5ce7',
                        borderWidth: 2,
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { labels: { color: '#fff' } } },
                    scales: {
                        y: { beginAtZero: true, max: 100, ticks: { color: '#aaa' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                        x: { ticks: { color: '#aaa' }, grid: { color: 'rgba(255,255,255,0.05)' } }
                    }
                }
            });
        }
    });
</script>
{% endblock %}
