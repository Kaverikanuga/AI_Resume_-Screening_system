{% extends 'base.html' %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div class="container section-pad-top text-center">
    <div class="error-page" data-aos="zoom-in">
        <div class="error-code gradient-text">404</div>
        <h1 class="fw-bold">Page Not Found</h1>
        <p class="text-muted">{{ message or 'The page you are looking for doesn\'t exist or has been moved.' }}</p>
        <div class="mt-4">
            <a href="{{ url_for('main.index') if not current_user.is_authenticated else url_for('dashboard.index') }}" class="btn btn-gradient btn-lg"><i class="fas fa-home me-2"></i>Go Home</a>
        </div>
    </div>
</div>
{% endblock %}
