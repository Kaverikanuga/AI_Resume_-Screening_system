{% extends 'base.html' %}
{% block title %}Server Error{% endblock %}
{% block content %}
<div class="container section-pad-top text-center">
    <div class="error-page" data-aos="zoom-in">
        <div class="error-code gradient-text">500</div>
        <h1 class="fw-bold">Something Went Wrong</h1>
        <p class="text-muted">An unexpected error occurred. Please try again later.</p>
        <div class="mt-4">
            <a href="{{ url_for('main.index') if not current_user.is_authenticated else url_for('dashboard.index') }}" class="btn btn-gradient btn-lg"><i class="fas fa-home me-2"></i>Go Home</a>
            <button class="btn btn-outline-light btn-lg ms-2" onclick="location.reload()"><i class="fas fa-sync me-2"></i>Retry</button>
        </div>
    </div>
</div>
{% endblock %}
