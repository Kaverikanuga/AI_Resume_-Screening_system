{% extends 'base.html' %}
{% block title %}Resume Templates{% endblock %}
{% block content %}
<div class="page-header">
    <div class="container">
        <h1 class="gradient-text">Resume Templates</h1>
        <p>Choose a professional template to build your resume</p>
    </div>
</div>

<div class="container section-pad-top">
    <div class="row g-4">
        {% for t in templates %}
        <div class="col-md-6 col-lg-4" data-aos="fade-up" data-aos-delay="{{ loop.index0 * 100 }}">
            <div class="template-card glass-card p-4 text-center">
                <div class="template-mini {{ t.name }}">
                    <div class="mini-line bold"></div>
                    <div class="mini-line"></div>
                    <div class="mini-line short"></div>
                    <div class="mini-line"></div>
                    <div class="mini-line short"></div>
                </div>
                <h5 class="mt-3">{{ t.label }}</h5>
                <p class="text-muted small">{{ t.desc }}</p>
                <a href="{{ url_for('builder.index') }}" class="btn btn-outline-light btn-sm">Use Template</a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
