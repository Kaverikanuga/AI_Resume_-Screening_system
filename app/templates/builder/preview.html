{% extends 'base.html' %}
{% block title %}Resume Preview{% endblock %}
{% block head %}
<style>
    .resume-preview-container {
        background: #fff;
        color: #333;
        padding: 30px;
        border-radius: 12px;
        max-width: 800px;
        margin: 0 auto;
        box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    .resume-page h1 { font-size: 28px; margin-bottom: 4px; color: #1a2980; }
    .resume-page h2 { font-size: 18px; border-bottom: 2px solid #1a2980; padding-bottom: 4px; margin: 18px 0 8px; color: #1a2980; }
    .resume-page .resume-title { font-size: 16px; color: #555; }
    .resume-page .resume-contact { font-size: 13px; color: #666; margin-bottom: 10px; }
    .resume-page ul { margin: 0; padding-left: 20px; }
    .resume-page li { font-size: 14px; line-height: 1.6; }
    .resume-page p { font-size: 14px; line-height: 1.6; }
    /* Template variants */
    .resume-google .g-header { display: flex; align-items: center; gap: 15px; }
    .resume-google .g-letter { width: 60px; height: 60px; border-radius: 50%; background: #4285f4; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; }
    .resume-google h1 { color: #4285f4; margin: 0; }
    .resume-microsoft .ms-header { background: #0078d4; color: #fff; padding: 20px; margin: -30px -30px 20px; }
    .resume-microsoft .ms-header h1 { color: #fff; margin: 0; }
    .resume-harvard .hv-header { text-align: center; border-bottom: 3px double #8b0000; padding-bottom: 10px; margin-bottom: 15px; }
    .resume-harvard h1 { color: #8b0000; }
    .resume-harvard h2 { color: #8b0000; border-color: #8b0000; }
    .resume-creative { border-left: 6px solid #6c5ce7; padding-left: 20px; }
    .resume-creative h1 { color: #6c5ce7; }
    .resume-creative h2 { color: #6c5ce7; border-color: #6c5ce7; }
</style>
{% endblock %}
{% block content %}
<div class="page-header">
    <div class="container">
        <h1 class="gradient-text">Resume Preview</h1>
        <p>{{ template|capitalize }} Template</p>
    </div>
</div>

<div class="container section-pad-top">
    <div class="text-center mb-4" data-aos="fade-up">
        <a href="{{ url_for('builder.index') }}" class="btn btn-outline-light me-2"><i class="fas fa-arrow-left me-2"></i>Back to Builder</a>
        <button class="btn btn-gradient" onclick="window.print()"><i class="fas fa-print me-2"></i>Print / Save PDF</button>
    </div>
    <div class="resume-preview-container" data-aos="fade-up" data-aos-delay="100">
        {{ resume_html|safe }}
    </div>
</div>
{% endblock %}
